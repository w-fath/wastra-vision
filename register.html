<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Westra Vision — Daftar</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="page-wrapper">

  <div class="left-panel">
    <img class="bg-img" src="assets/img/login.png" alt="Batik" />
    <canvas id="network"></canvas>

    <div class="logo">
      <div class="logo-badge"><span>W</span></div>
      <div class="logo-info">
        <strong>Westra Vision</strong>
        <small>Platform</small>
      </div>
    </div>
  </div>

  <div class="right-panel">

    <h1 class="form-heading">Mulai Langkah <span class="gold">Pertamamu!</span></h1>
    <p class="form-sub">Bergabung dengan lebih dari jutaan pengguna bersama kami sejak 2020 ini.</p>

    <div class="social-row">
      <button class="btn-social">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Daftar dengan Google
      </button>
      <button class="btn-social">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.42c1.27.07 2.15.77 2.89.8.9-.04 1.77-.76 3.04-.8 1.5-.05 2.6.72 3.3 1.85-3.04 1.86-2.53 5.9.5 7.05-.57 1.35-1.25 2.67-1.73 3.96zm-5.22-14.67c-.08-2.37 1.84-4.32 4.07-4.5.34 2.67-2.37 4.64-4.07 4.5z"/>
        </svg>
        Daftar dengan Apple ID
      </button>
    </div>

    <div class="divider-row"><span>atau</span></div>

    <div class="field">
      <label>Nama Lengkap</label>
      <input type="text" placeholder="Masukkan nama lengkap" />
    </div>

    <div class="field-row">
      <div class="field" style="margin-bottom:0">
        <label>Nomor Whatsapp</label>
        <input type="tel" placeholder="+62" />
      </div>
      <div class="field" style="margin-bottom:0">
        <label>E-mail</label>
        <input type="email" placeholder="email@domain.com" />
      </div>
    </div>

    <div class="field" style="margin-top:14px">
      <label>Kata Sandi</label>
      <div class="pwd-wrap">
        <input type="password" id="pwd" placeholder="Min. 8 karakter" />
        <button class="eye-btn" onclick="togglePwd()" aria-label="Tampilkan sandi">
          <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="17" height="17">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="check-row">
      <input type="checkbox" id="agree" />
      <label for="agree">Saya setuju dengan <a href="#">syarat &amp; ketentuan</a> dari Westra</label>
    </div>

    <button class="btn-submit" onclick="handleSubmit(this)">Daftar Sekarang</button>

    <p class="signin-note">sudah punya akun? <a href="#">sign in</a></p>

  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('network');
  const ctx = canvas.getContext('2d');
  let W, H, nodes = [], raf;

  function resize() {
    const panel = canvas.parentElement;
    W = canvas.width = panel.offsetWidth;
    H = canvas.height = panel.offsetHeight;
  }

  function createNodes(count) {
    nodes = [];
    for (let i = 0; i < count; i++) {
      nodes.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        r: Math.random() * 2.2 + 1,
        alpha: Math.random() * 0.6 + 0.3,
        pulse: Math.random() * Math.PI * 2
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    const t = Date.now() * 0.001;
    const maxDist = 160;

    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      n.x += n.vx;
      n.y += n.vy;
      if (n.x < 0 || n.x > W) n.vx *= -1;
      if (n.y < 0 || n.y > H) n.vy *= -1;
      n.pulse += 0.018;

      for (let j = i + 1; j < nodes.length; j++) {
        const m = nodes[j];
        const dx = n.x - m.x;
        const dy = n.y - m.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < maxDist) {
          const alpha = (1 - dist / maxDist) * 0.35;
          ctx.beginPath();
          ctx.moveTo(n.x, n.y);
          const cx = (n.x + m.x) / 2 + (Math.random() - 0.5) * 20;
          const cy = (n.y + m.y) / 2 + (Math.random() - 0.5) * 20;
          ctx.quadraticCurveTo(cx, cy, m.x, m.y);
          ctx.strokeStyle = `rgba(200,160,60,${alpha})`;
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      }
    }

    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      const glow = (Math.sin(n.pulse) * 0.5 + 0.5) * 0.5 + 0.3;
      const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 3.5);
      grad.addColorStop(0, `rgba(220,175,70,${glow})`);
      grad.addColorStop(1, `rgba(200,140,40,0)`);
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r * 3.5, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(230,185,80,${glow * 0.9})`;
      ctx.fill();
    }

    raf = requestAnimationFrame(draw);
  }

  function init() {
    resize();
    createNodes(55);
    cancelAnimationFrame(raf);
    draw();
  }

  window.addEventListener('resize', init);
  init();
})();

function togglePwd() {
  const input = document.getElementById('pwd');
  const icon = document.getElementById('eye-icon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    input.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

function handleSubmit(btn) {
  btn.textContent = 'Mendaftar...';
  btn.style.opacity = '0.7';
  setTimeout(() => { btn.textContent = 'Daftar Sekarang'; btn.style.opacity = '1'; }, 2000);
}
</script>

</body>
</html>
