<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Wastra Wialam</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            lime: '#B8D322',
                            card: '#2A2A2A',
                            input: '#E2E2E2',
                            btnDark: '#1A1A1A',
                            btnSubmit: '#0F0F0F'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="antialiased overflow-x-hidden min-h-screen relative flex items-center justify-center lg:justify-end lg:pr-[8%] bg-black">

    <div class="absolute inset-0 z-0 w-full h-full">
        <img src="assets/img/login.png" alt="Background Batik" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/1920x1080/1a1a1a/333333?text=Gambar+Batik+(assets/img/login.png)'" />
        <div class="absolute inset-0 bg-black/40"></div>
    </div>

    <div class="absolute top-6 left-6 lg:top-10 lg:left-10 z-20">
        <img src="assets/img/logo.png" alt="Wastra Wialam Logo" class="h-8 lg:h-10 w-auto" onerror="this.src='https://placehold.co/150x40/transparent/ffffff?text=Logo+Wastra'" />
    </div>

    <div class="relative z-10 w-full max-w-[460px] bg-brand-card rounded-xl shadow-2xl p-8 lg:p-10 mx-4 lg:mx-0 border border-white/5">
        
        <div class="mb-8">
            <h1 class="text-2xl lg:text-[26px] font-bold text-white mb-2 leading-tight">
                Selamat Datang <span class="text-brand-lime">Kembali!</span>
            </h1>
            <p class="text-[12px] lg:text-[13px] text-gray-400">
                Masuk untuk melanjutkan petualangan dan studimu.
            </p>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 mb-7">
            <button type="button" class="flex-1 bg-brand-btnDark border border-white/10 hover:bg-[#222] transition-colors duration-200 text-white rounded-lg py-2.5 flex items-center justify-center gap-2.5 text-xs font-medium">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.58c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Masuk dengan Google
            </button>
            
            <button type="button" class="flex-1 bg-brand-btnDark border border-white/10 hover:bg-[#222] transition-colors duration-200 text-white rounded-lg py-2.5 flex items-center justify-center gap-2.5 text-xs font-medium">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M16.365 1.44c0 0-3.328-.15-5.69 2.518-1.576 1.777-1.396 3.935-1.396 3.935s3.21.135 5.568-2.63c1.47-1.737 1.518-3.82-1.518-3.82-.125-.33-.277-.666-.453-.996-1.047-1.972-2.73-2.63-4.326-2.63-1.898 0-3.555 1.168-4.502 1.168-.948 0-2.316-1.046-3.86-1.046-2.392 0-4.662 1.435-5.917 3.633-2.544 4.453-.65 11.043 1.83 14.653 1.205 1.758 2.63 3.738 4.542 3.668 1.84-.07 2.544-1.186 4.776-1.186 2.21 0 2.86.1186 4.775 1.186 1.983.07 3.19-1.72 4.37-3.483 1.362-2.015 1.922-3.966 1.945-4.07-.046-.017-3.813-1.464-3.813-5.83z"/>
                </svg>
                Masuk dengan Apple
            </button>
        </div>

        <form class="flex flex-col gap-4">
            
            <div class="flex flex-col gap-1.5">
                <label class="text-[11px] text-gray-300 font-medium">E-mail</label>
                <input type="email" class="w-full bg-brand-input text-gray-900 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-lime transition-all" />
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-[11px] text-gray-300 font-medium">Kata Sandi</label>
                <input type="password" class="w-full bg-brand-input text-gray-900 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-lime transition-all" />
            </div>

            <div class="flex items-center justify-between mt-1 mb-2">
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="remember" class="w-3.5 h-3.5 bg-transparent border border-gray-500 rounded-sm accent-brand-lime cursor-pointer" />
                    <label for="remember" class="text-[10px] text-gray-400 cursor-pointer select-none">
                        Ingat saya
                    </label>
                </div>
                <a href="#" class="text-[10px] text-gray-400 hover:text-brand-lime transition-colors">
                    Lupa Kata Sandi?
                </a>
            </div>

            <a href="dashboard.html" class="text-center w-full bg-brand-btnSubmit border border-white/5 hover:bg-black transition-colors duration-200 text-white rounded-md py-3 mt-1 text-xs font-semibold tracking-wide">
                Masuk Sekarang
            </a>

            <div class="text-center mt-3">
                <p class="text-[11px] text-gray-400">
                    Belum punya akun? <a href="register.html" class="text-brand-lime font-medium hover:underline">Daftar disini</a>
                </p>
            </div>
            
        </form>
    </div>

</body>
</html>
